<!DOCTYPE html>
<html>

<head>
  <title>Victron</title>
  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- PWA resources-->
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/%REACT_APP_WHITELABEL%/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/%REACT_APP_WHITELABEL%/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/%REACT_APP_WHITELABEL%/favicon-16x16.png">
  <link rel="manifest" href="%PUBLIC_URL%/%REACT_APP_WHITELABEL%/manifest.json">
  <link rel="mask-icon" href="%PUBLIC_URL%/%REACT_APP_WHITELABEL%/safari-pinned-tab.svg" color="#1f2535">
  <meta name="msapplication-TileColor" content="#1f2535">
  <meta name="theme-color" content="#1f2535">
</head>

<body>
<div id="root" class="w-full h-full"></div>

<script>
(function() {
  var MAX_ENTRIES = 100;
  var MAX_MSG_LEN = 500;
  var _buffer = [];
  var _head = 0;

  function safeStr(arg) {
    if (arg === undefined) return "undefined";
    if (arg === null) return "null";
    if (arg instanceof Error) {
      return arg.message + (arg.stack ? "\n" + arg.stack : "");
    }
    if (typeof arg === "object") {
      try { return JSON.stringify(arg); } catch (e) { return String(arg); }
    }
    return String(arg);
  }

  function fmtArgs(args) {
    var parts = [];
    for (var i = 0; i < args.length; i++) parts.push(safeStr(args[i]));
    var msg = parts.join(" ");
    return msg.length > MAX_MSG_LEN ? msg.substring(0, MAX_MSG_LEN) + "..." : msg;
  }

  var overlay = document.createElement("div");
  var s = overlay.style;
  s.position = "fixed"; s.bottom = "60px"; s.right = "10px";
  s.bottom = "calc(var(--px44, 44px) + 16px)";
  s.width = "120ch"; s.maxWidth = "95vw";
  s.zIndex = "99999"; s.display = "none";
  s.fontFamily = "monospace"; s.fontSize = "13px"; s.lineHeight = "1.4";
  s.backgroundColor = "rgba(18, 26, 40, 0.92)";
  s.color = "rgba(200, 200, 200, 1.0)";
  s.border = "1px solid rgba(80, 80, 80, 1.0)";
  s.borderRadius = "4px"; s.overflow = "hidden";

  var titleBar = document.createElement("div");
  var ts = titleBar.style;
  ts.padding = "4px 8px"; ts.backgroundColor = "rgba(30, 40, 60, 1.0)";
  ts.color = "rgba(220, 220, 220, 1.0)";
  ts.cursor = "move"; ts.userSelect = "none"; ts.webkitUserSelect = "none";
  ts.borderBottom = "1px solid rgba(80, 80, 80, 1.0)";
  ts.display = "flex"; ts.alignItems = "center";

  var btnStyle = "cursor:pointer;padding:4px 10px;margin-left:8px;font-size:13px;" +
    "color:rgba(220,220,220,1.0);background-color:rgba(60,70,90,1.0);border-radius:3px";

  var title = document.createElement("span");
  title.textContent = "Diagnostic Console";
  title.style.cssText = btnStyle + ";font-weight:bold;cursor:move;background-color:transparent;padding-left:0";

  var spacer = document.createElement("span");
  spacer.style.flex = "1";

  var clearBtn = document.createElement("span");
  clearBtn.textContent = "Clear";
  clearBtn.style.cssText = btnStyle;
  clearBtn.addEventListener("click", function() { window.diagConsole.clear(); });

  var closeBtn = document.createElement("span");
  closeBtn.textContent = "Close";
  closeBtn.style.cssText = btnStyle;
  closeBtn.addEventListener("click", function() { window.diagConsole.hide(); });

  titleBar.appendChild(title);
  titleBar.appendChild(spacer);
  titleBar.appendChild(clearBtn);
  titleBar.appendChild(closeBtn);

  var logArea = document.createElement("div");
  var ls = logArea.style;
  ls.height = "14em"; ls.overflowY = "auto"; ls.overflowX = "hidden";
  ls.padding = "4px 8px"; ls.whiteSpace = "pre-wrap"; ls.wordBreak = "break-all";

  overlay.appendChild(titleBar);
  overlay.appendChild(logArea);
  document.body.appendChild(overlay);

  var LEVEL_COLORS = {
    LOG: "rgba(180, 180, 180, 1.0)",
    WARN: "rgba(240, 200, 50, 1.0)",
    ERR: "rgba(240, 80, 80, 1.0)"
  };

  function renderEntry(entry) {
    var div = document.createElement("div");
    var color = LEVEL_COLORS[entry.level] || LEVEL_COLORS.LOG;
    div.style.color = color;
    var timeSpan = document.createElement("span");
    timeSpan.style.color = "rgba(120, 120, 120, 1.0)";
    timeSpan.textContent = entry.time.toTimeString().substring(0, 8) + " ";
    var lvlSpan = document.createElement("span");
    lvlSpan.textContent = "[" + entry.level + "] ";
    var msgSpan = document.createElement("span");
    msgSpan.textContent = entry.message;
    div.appendChild(timeSpan);
    div.appendChild(lvlSpan);
    div.appendChild(msgSpan);
    logArea.appendChild(div);
    logArea.scrollTop = logArea.scrollHeight;
    if (logArea.children.length > MAX_ENTRIES) {
      logArea.removeChild(logArea.firstChild);
    }
  }

  function addEntry(level, message) {
    var entry = { time: new Date(), level: level, message: message };
    if (_buffer.length < MAX_ENTRIES) {
      _buffer.push(entry);
    } else {
      _buffer[_head] = entry;
      _head = (_head + 1) % MAX_ENTRIES;
    }
    renderEntry(entry);
  }

  var _origLog = console.log;
  var _origWarn = console.warn;
  var _origError = console.error;

  console.log = function() {
    _origLog.apply(console, arguments);
    addEntry("LOG", fmtArgs(arguments));
  };
  console.warn = function() {
    _origWarn.apply(console, arguments);
    addEntry("WARN", fmtArgs(arguments));
  };
  console.error = function() {
    _origError.apply(console, arguments);
    addEntry("ERR", fmtArgs(arguments));
  };

  var _prevOnError = window.onerror;
  window.onerror = function(msg, url, line, col, err) {
    var message = String(msg);
    if (url) message += " at " + url + ":" + line + ":" + col;
    if (err && err.stack) message += "\n" + err.stack;
    addEntry("ERR", message);
    if (typeof _prevOnError === "function") {
      return _prevOnError.call(window, msg, url, line, col, err);
    }
  };

  var _isDragging = false;
  var _dragOffX = 0, _dragOffY = 0;

  function getXY(e) {
    if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function onDragStart(e) {
    _isDragging = true;
    var pos = getXY(e);
    var rect = overlay.getBoundingClientRect();
    _dragOffX = pos.x - rect.left;
    _dragOffY = pos.y - rect.top;
    e.preventDefault();
  }

  function onDragMove(e) {
    if (!_isDragging) return;
    var pos = getXY(e);
    overlay.style.bottom = "auto"; overlay.style.right = "auto";
    overlay.style.left = (pos.x - _dragOffX) + "px";
    overlay.style.top = (pos.y - _dragOffY) + "px";
  }

  function onDragEnd() { _isDragging = false; }

  titleBar.addEventListener("mousedown", onDragStart);
  document.addEventListener("mousemove", onDragMove);
  document.addEventListener("mouseup", onDragEnd);
  titleBar.addEventListener("touchstart", onDragStart);
  document.addEventListener("touchmove", onDragMove);
  document.addEventListener("touchend", onDragEnd);

  var _listener = null;
  function setVisible(v) {
    overlay.style.display = v ? "block" : "none";
    if (v) logArea.scrollTop = logArea.scrollHeight;
    if (typeof _listener === "function") _listener(v);
  }

  window.diagConsole = {
    show: function() { setVisible(true); },
    hide: function() { setVisible(false); },
    toggle: function() { setVisible(overlay.style.display === "none" || overlay.style.display === ""); },
    isVisible: function() { return overlay.style.display === "block"; },
    onVisibilityChange: function(fn) { _listener = fn; },
    clear: function() {
      _buffer = []; _head = 0;
      while (logArea.firstChild) logArea.removeChild(logArea.firstChild);
    },
    getLog: function() {
      if (_buffer.length < MAX_ENTRIES) return _buffer.slice();
      return _buffer.slice(_head).concat(_buffer.slice(0, _head));
    }
  };
})();
</script>

</body>

</html>
