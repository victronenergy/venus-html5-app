# Serves the built dist/ the way a Venus device does, including the precompressed .gz assets.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # serve the .gz-only assets to every client, decompressing for clients without gzip support
    gzip_static always;
    gunzip on;

    # hashed assets: no try_files here, it would not see the precompressed .gz-only files and fall back to index.html
    location /app/static/ {
        alias /usr/share/nginx/html/static/;
    }
    location /static/ {
    }

    # PUBLIC_URL=/app builds (default .env)
    location /app/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # PUBLIC_URL=/ builds (CI)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
